services:
  - type: web
    name: gmit-attendance-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false          # Set this manually in Render dashboard
      - key: DB_NAME
        value: smart_attendance
      - key: CORS_ORIGINS
        value: https://YOUR-PROJECT.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/
